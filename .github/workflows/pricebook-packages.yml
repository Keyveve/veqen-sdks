name: Price-book packages
on:
  pull_request:
    paths: ['pricebook-packages/**', 'python/veqen/data/prices.json', 'scripts/package_pricebook.py', '.github/workflows/pricebook-packages.yml']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish reviewed snapshot to the selected registry
      registry:
        type: choice
        default: pypi
        options: [pypi, npm]
        description: Package registry
      version:
        type: string
        description: Exact package version, required when publishing
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v6
        with: {node-version: '24', package-manager-cache: false}
      - run: python scripts/package_pricebook.py
      - run: git diff --exit-code -- pricebook-packages
      - run: python -m pip install build twine && python -m build pricebook-packages/python --outdir dist && python -m twine check dist/*
      - run: pip install --no-deps dist/*.whl
      - name: Check installed Python snapshot
        run: |
          cd /tmp
          python -c "from veqen_pricebook import load; b=load(); assert b['schema']==2; assert b['models']['openai/gpt-4o']['rates']['standard']['in']==2.5; b['models'].clear(); assert len(load()['models'])>100"
      - run: cd pricebook-packages/js && npm test && npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: pricebook-python
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pricebook-npm
          path: pricebook-packages/js/*.tgz
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish && inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi-pricebook
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with: {name: pricebook-python, path: dist}
      - name: Check approved version
        env: {RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          python -c "import os,pathlib,zipfile,email; w,=pathlib.Path('dist').glob('*.whl'); z=zipfile.ZipFile(w); m,=[n for n in z.namelist() if n.endswith('/METADATA')]; assert email.message_from_bytes(z.read(m))['Version']==os.environ['RELEASE_VERSION']"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
  publish-npm:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish && inputs.registry == 'npm'
    runs-on: ubuntu-latest
    environment: npm-pricebook
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@v4
        with: {name: pricebook-npm, path: dist}
      - name: Check approved package and version
        env: {RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          tar -xzf dist/*.tgz package/package.json
          node -e "const p=JSON.parse(require('fs').readFileSync('package/package.json','utf8')); if (p.name !== '@veqen/pricebook' || p.version !== process.env.RELEASE_VERSION) process.exit(1)"
      - name: Publish reviewed artifact with provenance
        run: npm publish ./dist/*.tgz --access public --provenance --tag latest --ignore-scripts
